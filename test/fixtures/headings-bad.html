<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Headings — bad</title></head>
<body>
  <h1>Team Members</h1>
  <h1>Team Members</h1>   <!-- duplicate h1 -->
  <h2></h2>                    <!-- empty -->
  <h2>Untitled</h2>            <!-- placeholder -->
  <h3>Details</h3>
  <h3>Details</h3>             <!-- duplicate siblings at one level -->
  <form id="f">
    <label for="d1">Date</label><input id="d1">
    <label for="d2">Date</label><input id="d2">   <!-- duplicate label in one form -->
    <label for="g1">Field 1</label><input id="g1"> <!-- generic label -->
  </form>
</body></html>
